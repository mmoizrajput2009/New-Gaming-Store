<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moji Game Store 🎮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        header {
            background: #1e293b;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .cart-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .cart-btn:hover {
            background: #0369a1;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #e2e8f0;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media(min-width: 768px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .search-input {
            padding: 0.8rem 1rem;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 1rem;
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .cat-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .cat-btn.active,
        .cat-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #f1f5f9;
        }

        .card-category {
            font-size: 0.85rem;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #4ade80;
        }

        .buy-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .buy-btn:hover {
            background: #059669;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">🎮 Moji Game Store</div>
        <button class="cart-btn" onclick="alert('Cart is empty!')">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Level Up Your Gaming Experience</h1>
            <p>Explore top action, adventure, and RPG titles handpicked for you.</p>
        </div>

        <div class="controls">
            <input type="text" id="search" class="search-input" placeholder="Search games..." onkeyup="filterGames()">
            <div class="categories">
                <button class="cat-btn active" onclick="filterCategory('All')">All</button>
                <button class="cat-btn" onclick="filterCategory('Action')">Action</button>
                <button class="cat-btn" onclick="filterCategory('RPG')">RPG</button>
                <button class="cat-btn" onclick="filterCategory('Open World')">Open World</button>
            </div>
        </div>

        <div class="grid" id="game-grid">
            <!-- Game Cards will be loaded dynamically -->
        </div>
    </div>

    <script>
        const games = [
            {id: 1, title: "Cyber Strike 2077", category: "Action", price: "$59.99", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500"},
            {id: 2, title: "Shadow Legends RPG", category: "RPG", price: "$49.99", img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500"},
            {id: 3, title: "Wild West Horizon", category: "Open World", price: "$69.99", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500"},
            {id: 4, title: "Ninja Blade Zero", category: "Action", price: "$39.99", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500"},
            {id: 5, title: "Mythic Quest Online", category: "RPG", price: "$29.99", img: "https://images.unsplash.com/photo-1612287233202-b51a36616763?w=500"},
            {id: 6, title: "Galactic Racer", category: "Action", price: "$19.99", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500"}
        ];

        let cartCount = 0;

        function displayGames(items) {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            items.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${game.img}" alt="${game.title}">
                    <div class="card-body">
                        <span class="card-category">${game.category}</span>
                        <h3 class="card-title">${game.title}</h3>
                        <div class="price-row">
                            <span class="price">${game.price}</span>
                            <button class="buy-btn" onclick="addToCart('${game.title}')">Order Now</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(title) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(`"${title}" has been added to your cart, Moji! 🛒✨`);
        }

        function filterGames() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(query));
            displayGames(filtered);
        }

        function filterCategory(category) {
            // Update active button style
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'All') {
                displayGames(games);
            } else {
                const filtered = games.filter(g => g.category === category);
                displayGames(filtered);
            }
        }

        // Initial Load
        displayGames(games);
    </script>
</body>

</html>
